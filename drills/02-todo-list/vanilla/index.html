<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02-todo-list</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="todo">
        <div class="todo__row">
            <input class="todo__input" type="text" placeholder="할 일을 입력하세요">
            <button class="todo__button">추가</button>
        </div>

        <ul class="todo__list"></ul>

        <p class="todo__remain">남은 할 일 <span class="todo__total"></span>개</p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
